plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace "com.example.mitchellramirez2"
    compileSdk 37

    defaultConfig {
        applicationId "com.example.mitchellramirez2"
        minSdk 27
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }
}

dependencies {
    // UI & Core AndroidX
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.cardview

    // Utilities & Charts
    implementation libs.jbcrypt
    implementation libs.biometric
    implementation libs.mpandroidchart

    // Firebase (BoM manages versions for all firebase-* libs)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth

    // Google Identity & Credential Manager
    implementation libs.googleid.v111
    implementation libs.credentials.v122
    implementation libs.credentials.play.services.auth.v122

    // Database & Encryption (16 KB page-aligned)
    implementation libs.sqlcipher
    implementation libs.sqlite
}